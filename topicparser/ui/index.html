  const step = WIZ_STEPS[WIZ];
  const total = WIZ_STEPS.length;
  $('#wiz-step').textContent = tr('wizard.step', {n:WIZ+1, total:total});
  $('#wiz-back').textContent = tr('wizard.back');
  $('#wiz-back').hidden = WIZ === 0;
  // Skip is offered on every step that asks for something, not just the cookies one.
  // Someone who just downloaded this wants to see what it IS before going off to
  // create two API tokens, and the guide used to be a wall: Next stays disabled until
  // a key verifies, so the only way past was the × in the corner.
  $('#wiz-skip').textContent = tr(step === 'cookies' ? 'wizard.skip' : 'wizard.skip_key');
  $('#wiz-skip').hidden = (step === 'intro' || step === 'done');
  $('#wiz-next').textContent = (WIZ === total-1) ? tr('wizard.finish') : tr('wizard.next');
  syncWizNext();

  const body = $('#wiz-body');
  if(step === 'intro'){
    $('#wiz-title').textContent = tr('wizard.title');
    body.innerHTML = `<div class="wiz-text">${esc(tr('wizard.intro'))}</div>`;
  } else if(step === 'github' || step === 'openai'){
    const key = step === 'github' ? 'GITHUB_TOKEN' : 'OPENAI_API_KEY';
    const label = step === 'github' ? 'settings.github' : 'settings.openai';
    const help = step === 'github' ? 'settings.github_help' : 'settings.openai_help';
    $('#wiz-title').textContent = tr(label);
    body.innerHTML = `<div class="wiz-text">${esc(tr(help))}</div>
      <div class="set-row">
        <input type="password" id="wiz-input" autocomplete="off" spellcheck="false"
               placeholder="${key === 'GITHUB_TOKEN' ? 'ghp_…' : 'sk-…'}">
        <button class="btn-ghost" data-wiz-verify="${key}">${esc(tr('settings.verify'))}</button>
        <span class="set-state" data-state="${key}"></span>
      </div>
      <div class="wiz-need" id="wiz-need">${esc(tr('wizard.need_check'))}</div>`;
  } else if(step === 'cookies'){
    $('#wiz-title').textContent = tr('settings.x');
    body.innerHTML = `<div class="wiz-text">${esc(tr('settings.x_help'))}</div>
      <div class="set-help">${esc(tr('settings.cookies_steps'))}</div>
      <textarea class="cookie-area" id="wiz-cookies" spellcheck="false"
        placeholder="${esc(tr('settings.cookies_ph'))}"></textarea>`;
  } else {
    $('#wiz-title').textContent = tr('wizard.done_title');
    // Skipping is allowed, so the last step has to say what is still missing —
    // otherwise the first run dies on the first API call with no explanation.
    let missing = [];
    try{ const st = await api().setup_state(); missing = (st && st.missing) || []; }catch(_){}
    const names = missing.filter(m => m !== 'cookies')
      .map(m => tr(m === 'GITHUB_TOKEN' ? 'settings.github' : 'settings.openai'));
    body.innerHTML = `<div class="wiz-text">${esc(tr('wizard.done_help'))}</div>` +
      (names.length ? `<div class="wiz-warn">${svg('alert')}<span>${
        esc(tr('wizard.still_missing', {keys: names.join(', ')}))}</span></div>` : '');
  }
}

// A key that was typed but never checked used to sail through, and the first run then
// died on the first API call. The step now waits for a green check.
function syncWizNext(){
  const step = WIZ_STEPS[WIZ];
  const key = step === 'github' ? 'GITHUB_TOKEN' : step === 'openai' ? 'OPENAI_API_KEY' : null;
  const btn = $('#wiz-next');
  if(!btn) return;
  btn.disabled = !!key && !WIZ_OK[key];
  const hint = $('#wiz-need');
  if(hint) hint.hidden = !btn.disabled;
}
async function wizardNext(){
  const step = WIZ_STEPS[WIZ];
  if(step === 'github' || step === 'openai'){
    const el = $('#wiz-input');
    const key = step === 'github' ? 'GITHUB_TOKEN' : 'OPENAI_API_KEY';
    if(el && el.value.trim()){
      const res = await api().save_settings({[key]: el.value.trim()});
      if(res && res.errors) return toast(res.errors[0]);
    }
  }
  if(step === 'cookies'){
    const el = $('#wiz-cookies');
    if(el && el.value.trim()){
      const res = await api().import_cookies(el.value);
      if(res && res.errors) return toast(res.errors[0]);   // stay put and say why
    }
  }
  if(WIZ >= WIZ_STEPS.length - 1){ closeWizard(); return; }
  WIZ += 1; renderWizard();
}

async function onWizardClick(e){
  const v = e.target.closest('[data-wiz-verify]');
  if(v){
    const key = v.dataset.wizVerify;
    const input = $('#wiz-input');
    if(input && input.value.trim()) await api().save_settings({[key]: input.value.trim()});
    await verifyKey(key);
    const state = document.querySelector(`[data-state="${key}"]`);
    WIZ_OK[key] = !!(state && state.classList.contains('ok'));
    syncWizNext();
    return;
  }
}

/* ---- prompts ---- */
// The rules that decide the feed. A profile's own file is editable; the shared ones
// are shown but locked — they carry the output contract, and a broken one costs a
// whole run without ever raising.
let PROMPTS = [];
let PROMPT_SELECTED = null;
let PROMPT_TEXT = "";      // what is in the box, so a re-render does not lose an edit
let PROMPT_FILE = null;    // the last get_prompt() reply: editable? has a backup?

async function renderPrompts(){
  PROMPTS = (await api().list_prompts()) || [];
  if(!PROMPT_SELECTED || !PROMPTS.some(p => p.name === PROMPT_SELECTED)){
    const first = PROMPTS.find(p => p.editable);
    PROMPT_SELECTED = first ? first.name : (PROMPTS[0] || {}).name || null;
    PROMPT_TEXT = null;
  }
  renderPromptList();
  await renderPromptEditor();
}

function promptRow(p){
  return `<button class="plist-item ${p.name===PROMPT_SELECTED?'active':''}"
            data-prompt="${esc(p.name)}">${esc(p.name)}</button>`;
}
// `_meta` is not a file you browse to — it IS the text the guide hands you, so it lives
// inside the guide and no longer takes a section of its own in the list. It was listed
// separately for one day and the owner's reaction was that a whole heading for a file
// you already reach while making a profile is pointless.
const META_PROMPTS = ['_meta'];
function renderPromptList(){
  const own = PROMPTS.filter(p => p.editable && !META_PROMPTS.includes(p.name));
  $('#prompt-list-own').innerHTML = own.map(promptRow).join('');
  $('#prompt-list-shared').innerHTML = PROMPTS.filter(p=>!p.editable).map(promptRow).join('');
}

async function renderPromptEditor(){
  const box = $('#prompt-editor');
  if(!PROMPT_SELECTED){
    box.innerHTML = '<div class="empty">'+esc(tr('prompts.pick_left'))+'</div>';
    return;
  }
  const p = await api().get_prompt(PROMPT_SELECTED);
  PROMPT_FILE = p;
  if(PROMPT_TEXT === null || PROMPT_TEXT === undefined) PROMPT_TEXT = p.text || '';
  const editable = !!p.editable;
  const about = tr('prompts.about.'+p.name);
  // The text is a PREVIEW here. It used to be a live textarea on the page, so the
  // whole file was one stray keystroke from being replaced — editing happens in a
  // modal you have to open on purpose, and saving keeps the previous version.
  box.innerHTML = `
    <div class="prompt-head">
      <span class="prompt-name">${esc(p.name)}</span>
      ${editable ? '' : `<span class="prompt-lock">${svg('lock')}${esc(tr('prompts.readonly_badge'))}</span>`}
      <span class="spacer"></span>
      ${editable ? `<button class="btn-ghost" id="prompt-edit">${svg('edit')}${esc(tr('prompts.edit'))}</button>
        <button class="btn-ghost" id="prompt-test">${svg('play')}${esc(tr('prompts.test'))}</button>` : ''}
    </div>
    ${about && about !== 'prompts.about.'+p.name
        ? `<div class="prompt-about">${esc(about)}</div>` : ''}
    <div class="prompt-preview" id="prompt-preview">${esc(PROMPT_TEXT)}</div>
    ${editable
      ? `<div class="prompt-note">${esc(tr('prompts.test_hint'))}</div>`
      : `<div class="prompt-note">${esc(tr('prompts.readonly_note'))}</div>`}
    ${editable && !META_PROMPTS.includes(p.name) ? promptGuideHtml() : ''}
    <div id="test-result"></div>`;
}

// "How do I write one of these?" had no answer anywhere in the app. The recipe is the
// one the owner actually uses: take the prompt that already works, hand it to an LLM,
// let it interview you, paste the result back. Collapsed by default — it is a thing you
// read once, not furniture.
let GUIDE_OPEN = localStorage.getItem('promptGuideOpen') === '1';
function promptGuideHtml(){
  const steps = [1,2,3,4,5].map(n => tr('prompts.guide_s'+n))
    .filter(s => s && !s.startsWith('prompts.guide_s'));
  return `<div class="guide ${GUIDE_OPEN?'open':''}" id="prompt-guide">
    <button class="guide-head" id="guide-toggle" type="button">
      ${svg('help')}<span>${esc(tr('prompts.guide_title'))}</span>
      <span class="spacer"></span>${svg('chevron','guide-chev')}</button>
    <div class="guide-body">
      <ol class="guide-steps">${steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
      <div class="guide-acts">
        <button class="btn-ghost" id="guide-copy">${svg('copy')}${esc(tr('prompts.guide_copy'))}</button>
      </div>
    </div></div>`;
}
function toggleGuide(){
  GUIDE_OPEN = !GUIDE_OPEN;
  localStorage.setItem('promptGuideOpen', GUIDE_OPEN ? '1' : '0');
  const g = $('#prompt-guide'); if(g) g.classList.toggle('open', GUIDE_OPEN);
}
// What the owner hands to the LLM: the rules that already work, plus the instruction to
// interview him and give back a file in the same shape.
// The clipboard gets `_meta.txt` and NOTHING else. The first version pasted a sentence
// I had written plus the profile's CURRENT rules, so pressing the button handed the LLM
// a half-written skeleton to react to — while `_meta.txt` already held the real thing:
// a finished interview prompt that asks about the subject and writes the rules.
async function copyGuidePayload(){
  let text = '';
  try{ text = (await api().get_prompt('_meta')).text || ''; }catch(_){}
  if(!text) return toast(tr('toast.copy_failed'));
  try{ await navigator.clipboard.writeText(text); toast(tr('toast.copied')); }
  catch(e){ toast(tr('toast.copy_failed')); }
}

/* ---- prompt editor, in a modal ----------------------------------------------
   The editor used to BE the page: a live textarea holding 33 KB of scoring rules,
   always focusable, with a Save right under it and no undo of any kind. Now it opens
   on purpose, warns before throwing away an unsaved edit, and can put back the
   version a save replaced (Api.restore_prompt). */
let EDITOR_DRAFT = '';
function editorDirty(){ return EDITOR_DRAFT !== (PROMPT_TEXT || ''); }

function openPromptEditor(){
  if(!PROMPT_FILE || !PROMPT_FILE.editable) return;
  EDITOR_DRAFT = PROMPT_TEXT || '';
  $('#pe-name').textContent = PROMPT_SELECTED;
  $('#pe-area').value = EDITOR_DRAFT;
  $('#pe-restore').hidden = !PROMPT_FILE.has_backup;
  $('#prompt-modal').hidden = false;
  $('#pe-area').focus();
}
function closePromptEditor(force){
  if(!force && editorDirty() && !confirm(tr('prompts.confirm_discard'))) return;
  $('#prompt-modal').hidden = true;
  EDITOR_DRAFT = '';
}
async function savePromptFromEditor(){
  const text = $('#pe-area').value;
  const res = await api().save_prompt(PROMPT_SELECTED, text);
  if(res && res.errors) return toast(res.errors[0]);
  PROMPT_TEXT = text;
  toast(tr('prompts.saved'));
  closePromptEditor(true);
  await renderPromptEditor();
}
async function restorePromptVersion(){
  if(!confirm(tr('prompts.confirm_restore'))) return;
  const res = await api().restore_prompt(PROMPT_SELECTED);
  if(res && res.errors) return toast(res.errors[0]);
  PROMPT_TEXT = res.text || '';
  EDITOR_DRAFT = PROMPT_TEXT;
  $('#pe-area').value = PROMPT_TEXT;
  toast(tr('prompts.restored'));
  await renderPromptEditor();
}

async function testPrompt(){
  const btn = $('#prompt-test');
  if(btn){ btn.disabled = true; btn.textContent = tr('prompts.testing'); }
  // the draft when the editor is open, the saved file otherwise
  const candidate = $('#prompt-modal').hidden ? PROMPT_TEXT : $('#pe-area').value;
  const res = await api().test_prompt(PROMPT_SELECTED, candidate);
  if(btn){ btn.disabled = false; btn.innerHTML = svg('play') + esc(tr('prompts.test')); }
  if(!res || res.errors) return toast((res && res.errors && res.errors[0]) || 'failed');
  renderTestResult(res);
}

function renderTestResult(r){
  const source = r.is_sample
    ? tr('prompts.test_source_sample')
    : tr('prompts.test_source_run', {run:r.run, tested:r.tested, total:r.total_available});
  const skipped = r.skipped ? ' · ' + tr('prompts.test_skipped', {n:r.skipped}) : '';
  const rows = (r.rows||[]).map(row => {
    const after = row.after === null || row.after === undefined
      ? `<span class="n none">·</span>`
      : `<span class="n${row.after >= r.threshold ? ' up' : ''}">${row.after}</span>`;
    return `<div class="test-row">
      <span class="t" title="${esc(row.text||'')}">${esc(row.title)}</span>
      <span class="n">${row.before === null || row.before === undefined ? '·' : row.before}</span>
      ${after}</div>`;
  }).join('');
  $('#test-result').innerHTML = `<div class="test-box">
    <div class="test-summary">${esc(tr('prompts.test_summary',
      {passed:r.passed, tested:r.tested, threshold:r.threshold, before:r.before_passed}))}</div>
    <div class="test-meta">${esc(source)}${esc(skipped)}</div>
    <div class="test-meta" style="margin-top:6px">${esc(tr('prompts.test_caveat'))}</div>
    <div class="test-rows">
      <div class="test-head"><span>${esc(tr('prompts.col_signal'))}</span>
        <span style="text-align:right">${esc(tr('prompts.col_before'))}</span>
        <span style="text-align:right">${esc(tr('prompts.col_after'))}</span></div>
      ${rows}</div></div>`;
}

function onPromptListClick(e){
  const it = e.target.closest('[data-prompt]'); if(!it) return;
  PROMPT_SELECTED = it.dataset.prompt;
  PROMPT_TEXT = null;                       // switching prompts loads the file afresh
  renderPromptList(); renderPromptEditor();
}
function onPromptEditorClick(e){
  if(e.target.closest('#prompt-edit')) return openPromptEditor();
  if(e.target.closest('#prompt-test')) return testPrompt();
  if(e.target.closest('#guide-toggle')) return toggleGuide();
  if(e.target.closest('#guide-copy')) return copyGuidePayload();
}


/* ---- tracked ---- */
let TRACKED_ROWS = [];
let TRACKED_SORT = { key: null, dir: -1 };   // dir: -1 = desc (default), 1 = asc
const TRACKED_COLS = [
  { key:'repo', i18n:'tracked.col_repo' },
  { key:'stars', i18n:'tracked.col_stars', num:true },
  { key:'velocity', i18n:'tracked.col_velocity', num:true },
  { key:'added', i18n:'tracked.col_added', num:true },
  { key:'last_measured', i18n:'tracked.col_measured', num:true },
];
async function renderTracked(){
  TRACKED_ROWS = await api().get_tracked();
  renderTrackedTable();
}
function sortedTrackedRows(){
  const { key, dir } = TRACKED_SORT;
  if(!key) return TRACKED_ROWS;
  return [...TRACKED_ROWS].sort((a, b) => {
    let av = a[key], bv = b[key];
    if(key === 'repo'){ av = av.toLowerCase(); bv = bv.toLowerCase(); }
    if(av == null && bv == null) return 0;
    if(av == null) return 1;    // nulls sort last regardless of direction
    if(bv == null) return -1;
    if(av < bv) return -dir;
    if(av > bv) return dir;
    return 0;
  });
}
function renderTrackedTable(){
  const box = $('#tracked-body');
  if(!TRACKED_ROWS.length){
    box.innerHTML = emptyState('star', 'tracked.empty_title', 'tracked.empty');
    return;
  }
  const body = sortedTrackedRows().map(r=>`
    <tr data-repo="${esc(r.repo)}">
      <td>
        <span class="repo" data-open data-url="${esc(r.url)}" title="${esc(tr('tracked.open_title'))}">${svg('github')}${esc(r.repo)}</span>
        ${r.description?`<div class="repo-desc">${esc(r.description)}</div>`:''}
      </td>
      <td class="num mono">${r.stars==null?'·':fmtNum(r.stars)}</td>
      <td class="num mono">${velHtml(r.velocity)}</td>
      <td class="num mono">${fmtDate(r.added)}</td>
      <td class="num mono">${fmtDate(r.last_measured)}</td>
      <td class="num row-acts">
        <button class="unwatch" data-unwatch>${svg('x')}${esc(tr('tracked.unwatch'))}</button>
      </td>
    </tr>`).join('');
  const head = TRACKED_COLS.map(c=>{
    const active = TRACKED_SORT.key === c.key;
    const arrow = active ? svg('chevron', 'sort-arrow'+(TRACKED_SORT.dir===1?' asc':'')) : '';
    return `<th class="sortable${c.num?' num':''}" data-sort="${c.key}">${esc(tr(c.i18n))}${arrow}</th>`;
  }).join('');
  box.innerHTML = `<table>
    <thead><tr>${head}<th></th></tr></thead>
    <tbody>${body}</tbody></table>
    <div class="tracked-note">${tr('tracked.note')}</div>`;
}
function velHtml(v){
  if(v==null) return '<span class="vel-measuring">'+esc(tr('tracked.measuring'))+'</span>';
  const n = Math.round(v);
  if(v>0.5) return `<span class="vel-up">${svg('trending')}+${n} ${esc(tr('unit.stars_per_day'))}</span>`;
  return `<span class="vel-flat">${(n>=0?'+':'')+n} ${esc(tr('unit.stars_per_day'))}</span>`;
}
async function onTrackedClick(e){
  const th = e.target.closest('[data-sort]');
  if(th){
    const key = th.dataset.sort;
    if(TRACKED_SORT.key === key) TRACKED_SORT.dir *= -1;
    else TRACKED_SORT = { key, dir: -1 };
    renderTrackedTable();
    return;
  }
  const open = e.target.closest('[data-open]');
  if(open){ api().open_url(open.dataset.url); return; }
  const b = e.target.closest('[data-unwatch]'); if(!b) return;
  const repo = b.closest('tr').dataset.repo;
  await api().unwatch_repo(repo); renderTracked();
}

/* ---- helpers ---- */
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pluralForm(n){
  if(LANG.startsWith('uk') || LANG.startsWith('ru')){
    if(n%100>=11 && n%100<=14) return 'many';
    const l = n%10; return l===1 ? 'one' : (l>=2 && l<=4 ? 'few' : 'many');
  }
  return n===1 ? 'one' : 'many';
}
function plural(n){ const f = STRINGS['plural.topics'] || {};
  return f[pluralForm(n)] || f.many || f.one || ''; }
// Stars are grouped by the SAME locale the dates use. The three call sites had it
// hardcoded — two as 'uk', one as 'en-US' — so the tracked table and the feed card
// showed the same star count differently, and an English build got uk grouping.
function fmtNum(n){
  // the SAME separator the .md uses (`export._stars`), read from the same catalogue
  // key — toLocaleString was a second mechanism for one number, and two mechanisms
  // for one number is how the tracked table once wrote 98,196 beside the card's 98 196
  return String(Math.round(Number(n))).replace(/\B(?=(\d{3})+(?!\d))/g, tr('locale.thousands'));
}
function fmtDate(iso){
  if(!iso) return '·';
  return new Date(iso).toLocaleDateString(tr('locale.date'), {day:'2-digit', month:'2-digit', year:'numeric'});
}

  showView('feed');
  // A fresh install has no keys and can do nothing, so the guide opens itself —
  // once, and over the feed, so it is obvious what it is setting up.
  try {
    const st = await api().setup_state();
    if(st && st.needs_onboarding) openWizard();
  } catch(_) {}
}
window.addEventListener('pywebviewready', init);
</script>
</body>
