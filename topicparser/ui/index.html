<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- pywebview serves this page from http://127.0.0.1:<port> and its JS<->Python
     bridge needs same-origin XHR plus eval, so 'self'/'unsafe-eval' are required
     (a probe with them removed dies with EvalError before the UI ever loads).
     What this still buys: NO other origin can be reached or loaded, so script that
     ever did slip into a card has nowhere to send anything. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; form-action 'none'; base-uri 'none'">
<title>Info Parser</title>
<style>
  /* Dark, derived from the IQON monitoring dashboard the owner picked as the reference
     (2026-08-08). Rules that took a dozen rejected attempts to land, keep them:
       - surfaces are NEUTRAL, no tint. A raised green channel reads as "everything is green".
       - flat: solid fill + 1px border. No card gradients.
       - no pure #FFFFFF anywhere; the score is the brightest thing on screen.
       - green is deep (#1FA96F) and appears in three places only: the primary button,
         the status dot, the trending icon. Filled green surfaces were rejected.
       - colour identifies the SOURCE: blue Twitter, violet GitHub, green trending.
       - three radii only, one easing. */
  :root{
    --bg:#08090A; --surface:#131415; --inset:#0E0F10;
    /* --faint is 4.7 on --bg but these caps labels sit on --surface, where it measured
       4.36 — under the 4.5 floor on the very smallest type in the app. Raised until it
       clears 4.5 on ALL THREE surfaces (bg 5.12 / surface 4.74 / inset 4.93). Measure a
       colour against the surface it actually lands on, not against the page. */
    /* Four text tiers, measured against --bg: 15.9 / 8.9 / 6.5 / 4.7. The first
       version ran 14.9 / 6.7 / 4.5 / 3.2 and the owner read the whole UI as faded.
       Cause was not one colour: --dim was the MOST used colour in the file (41 uses,
       more than --text itself) at 4.5, and --faint failed WCAG outright. The gap
       between tiers is what carries hierarchy, so all four moved together and --text
       stays below --score — the score is still the brightest thing on screen and
       pure #FFFFFF still appears nowhere. */
    --text:#E3E6E8; --muted:#A8AEB2; --dim:#8E9498; --faint:#7C8286;
    --border:#232426; --border-hi:#313335;
    --primary:#1FA96F; --primary-hover:#26BC7D; --on-primary:#04180F;
    --danger:#D2604C; --score:#E8EBEC;
    --tw-fg:#4FA9CE; --gh-fg:#9B72C8; --feed-fg:#C79A55;
    --flame:#1FA96F;
    --check:#3C4043; --check-hover:#4B4F52;
    --r-lg:16px; --r-md:10px; --r-sm:6px;
    --ease:cubic-bezier(0.23,1,0.32,1);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,sans-serif;
    font-size:15px; color:var(--text); background:var(--bg);
    /* antialiased is BACK. Removing it (to fight the faded look) handed macOS back its
       subpixel rendering, and on a dark background that puts colour fringes on every
       stem — the owner read it as text that "washes out" and blurs. Grayscale AA is
       the right call on dark; the weight that removal was chasing comes from the
       font-weight bump below instead. */
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
    font-weight:450;
    /* The root cause of "the text is squashed everywhere": body carried NO line-height, so every
       element without an explicit one inherited the browser default of roughly 1.2 —
       labels, list rows, table cells, headings, chips, the lot. Only the handful of
       places with a hand-written line-height escaped it. */
    line-height:1.65;
    position:relative;
  }
  /* the only green outside the three spots above: ambient light under the window */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:radial-gradient(1200px 620px at 50% 116%, rgba(31,169,111,.04), transparent 58%);
  }
  .ic{ width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8;
       stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
  .ic.fill{ fill:currentColor; stroke:none; }
  .mono{ font-family:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",monospace;
         font-variant-numeric:tabular-nums; }
  button{ font:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  a{ color:var(--tw-fg); }
  :focus-visible{ outline:2px solid var(--primary); outline-offset:2px; border-radius:var(--r-sm); }

  /* layout */
  .app{ display:flex; height:100vh; overflow:hidden; position:relative; z-index:1; }
  .sidebar{ width:210px; flex-shrink:0; background:var(--surface);
    border-right:1px solid var(--border); padding:18px 12px; display:flex; flex-direction:column; gap:3px; }
  .brand{ display:flex; align-items:center; gap:9px; font-weight:700; font-size:16px;
    letter-spacing:-.02em; padding:0 9px 18px; border-bottom:1px solid var(--border); margin-bottom:14px; }
  /* NO tile behind the mark. The artwork already IS a rounded square, so an inset
     panel with its own border and radius sat around a second rounded square and read
     as a dark box swallowing the logo. The mark carries the shape; the box only
     shrank it. */
  .brand .mk{ width:30px; height:30px; display:flex; align-items:center; justify-content:center; }
  /* The logo carries no `ic` class, so nothing sized it, and an auto-sized inline svg
     collapses to 0x0 as a flex item in the WebKit pywebview uses (measured), while
     Chrome stretches it to the box. That is why the sidebar showed an empty tile in
     the app and a correct mark in the browser harness. */
  .brand .mk .ic, .brand .mk svg{ width:30px; height:30px; }
  .nav-item{ display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:var(--r-md);
    color:var(--dim); font-weight:500; font-size:13.5px; text-align:left; width:100%;
    transition:background-color .15s var(--ease), color .15s var(--ease); }
  .nav-item:hover{ color:var(--text); background:rgba(255,255,255,.035); }
  .nav-item.active{ background:rgba(255,255,255,.06); color:var(--text); font-weight:600; }
  .nav-item:active{ transform:scale(.985); }
  .nav-count{ margin-left:auto; font-family:ui-monospace,"SF Mono","JetBrains Mono",monospace;
    font-variant-numeric:tabular-nums; font-size:11.5px; font-weight:600; line-height:1;
    padding:3px 7px; border-radius:999px; background:rgba(255,255,255,.05); color:var(--dim); }
  .nav-item.active .nav-count{ background:rgba(255,255,255,.07); color:var(--muted); }
  .nav-count[hidden]{ display:none; }
  .content{ flex:1; overflow-y:auto; padding:22px 30px 48px; }
  .content::-webkit-scrollbar{ width:10px; }
  .content::-webkit-scrollbar-thumb{ background:#202224; border-radius:999px; }
  .view[hidden]{ display:none; }
  /* the page title and its explanatory paragraph were removed on the owner's call —
     every screen starts at its content, the sidebar says where you are */
  .view-title{ display:none; }
  .view-sub{ display:none; }

  .btn-primary{ display:inline-flex; align-items:center; gap:7px; background:var(--primary);
    color:var(--on-primary); padding:9px 17px; border-radius:var(--r-md); font-weight:600; font-size:13px;
    transition:background-color .15s var(--ease); }
  .btn-primary:hover{ background:var(--primary-hover); }
  .btn-primary:active{ transform:scale(.97); }
  /* A disabled primary stayed green at .45 and still read as pressable. Dead means
     grey — the button says "not yet", the hint under it says why. */
  .btn-primary:disabled{ background:var(--inset); color:var(--faint);
    border:1px solid var(--border); cursor:default; transform:none; }
  .btn-primary:disabled:hover{ background:var(--inset); }
  .btn-ghost{ display:inline-flex; align-items:center; gap:6px; color:var(--muted);
    padding:9px 14px; border-radius:var(--r-md); font-size:13px;
    background:var(--inset); border:1px solid var(--border);
    transition:color .15s var(--ease), border-color .15s var(--ease); }
  .btn-ghost[hidden]{ display:none; }
  .btn-ghost:disabled{ opacity:.4; cursor:default; pointer-events:none; }
  .btn-ghost:hover{ color:var(--text); border-color:var(--border-hi); }
  .btn-ghost:active{ transform:scale(.97); }
  .btn-ghost.danger{ color:var(--danger); }
  .btn-ghost.danger:hover{ border-color:rgba(210,96,76,.4); }

  /* feed */
  .profile-box{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
    padding:18px; margin-bottom:8px; }
  .box-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.14em; color:var(--faint);
    font-weight:700; margin-bottom:12px; }
  .profile-row{ display:flex; align-items:center; gap:9px; flex-wrap:wrap;
    margin-top:16px; padding-top:16px; border-top:1px solid var(--border); }
  .cbox{ width:14px; height:14px; border-radius:4px; border:1px solid var(--border-hi);
    display:flex; align-items:center; justify-content:center; color:transparent;
    transition:background-color .15s var(--ease), border-color .15s var(--ease); }
  .cbox.on{ background:var(--check); border-color:var(--check-hover); color:var(--text); }
  .cbox .ic{ width:10px; height:10px; stroke-width:3; }
  .spacer{ flex:1; }
  .status{ font-size:13px; color:var(--muted); margin-left:4px; }

  .source-section{ display:flex; align-items:center; gap:10px; margin:26px 2px 12px; color:var(--muted); }
  .source-section .ic{ width:15px; height:15px; color:var(--dim); }
  .source-section .h{ font-weight:700; font-size:10.5px; text-transform:uppercase; letter-spacing:.2em; }
  .source-section .cnt{ font-size:11.5px; color:var(--dim); font-variant-numeric:tabular-nums;
    border:1px solid var(--border); border-radius:999px; padding:2px 9px; }
  /* The source colour belongs on the badge, the count outline and hit-tags — nowhere
     else. The feed's section headers carried none of it, so a Twitter block and a
     GitHub block read identically while their cards did not. Outline only: a filled
     pill here would be a coloured surface, which is exactly what was rejected. */
  .source-section.tw .cnt{ color:var(--tw-fg); border-color:rgba(79,169,206,.4); }
  .source-section.gh .cnt{ color:var(--gh-fg); border-color:rgba(155,114,200,.4); }
  .source-section.feed .cnt{ color:var(--feed-fg); border-color:rgba(199,154,85,.4); }
  .source-section .line{ flex:1; height:1px; background:var(--border); }
  .source-section[data-sec-toggle]{ cursor:pointer; }
  .sec-collapse{ background:none; border:none; color:var(--faint); cursor:pointer; padding:2px;
    margin:-2px -2px -2px 0; display:flex; align-items:center; transition:transform .15s var(--ease); }
  .source-section:hover .sec-collapse{ color:var(--text); }
  .feed-section.collapsed .sec-collapse{ transform:rotate(-90deg); }
  .feed-section.collapsed .section-body{ display:none; }

  .topic-card{ display:flex; gap:13px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--r-lg); padding:17px 19px; margin-bottom:10px;
    transition:border-color .15s var(--ease); }
  .topic-card:hover{ border-color:var(--border-hi); }
  .card-body{ flex:1; min-width:0; }
  .card-top{ display:flex; align-items:center; gap:10px; }
  .badge{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; }
  .badge .ic{ width:13px; height:13px; }
  .badge.tw{ color:var(--tw-fg); }
  .badge.gh{ color:var(--gh-fg); }
  .badge.feed{ color:var(--feed-fg); }
  .badge.other{ color:var(--dim); }
  .score{ font-weight:700; font-size:22px; letter-spacing:-.03em; color:var(--score);
    font-variant-numeric:tabular-nums; line-height:1; }
  .card-top-right{ margin-left:auto; }
  .card-title{ font-weight:600; font-size:15.5px; margin:11px 0 7px; line-height:1.5;
    letter-spacing:-.012em; color:var(--text); overflow-wrap:anywhere; }
  .card-why{ font-size:13.5px; color:var(--muted); line-height:1.65; }
  /* facts live in a band at the BOTTOM of the card — floating them to the right
     squeezed the title into a narrow column and left a gap under the badge */
  .card-foot{ display:flex; align-items:center; gap:9px; flex-wrap:wrap;
    margin-top:13px; padding-top:12px; border-top:1px solid var(--border); }
  .card-meta{ display:flex; align-items:center; gap:7px; flex-wrap:wrap;
    font-size:12px; color:var(--dim); }
  .card-meta .cm-stars{ display:inline-flex; align-items:center; gap:4px;
    color:var(--muted); font-weight:600; font-variant-numeric:tabular-nums; }
  .card-meta .cm-stars .ic{ width:13px; height:13px; }
  .card-meta .cm-dot{ color:var(--faint); }
  .card-tags{ display:flex; flex-wrap:wrap; gap:5px; margin-left:auto; }
  .card-tags .tag{ font-size:11px; line-height:1; padding:5px 8px; border-radius:var(--r-sm);
    background:var(--inset); color:var(--dim); border:1px solid var(--border);
    white-space:nowrap; }
  .card-tags .tag.hit{ background:transparent; border-color:rgba(155,114,200,.45);
    color:var(--gh-fg); font-weight:600; }
  .card-actions{ display:flex; gap:7px; margin-top:12px; flex-wrap:wrap; }
  .act{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted);
    background:var(--inset); border:1px solid var(--border); padding:6px 11px; border-radius:var(--r-md);
    transition:color .15s var(--ease), border-color .15s var(--ease); }
  .act:hover{ color:var(--text); border-color:var(--border-hi); }
  .act:active{ transform:scale(.97); }
  .act.open:hover{ color:var(--tw-fg); border-color:rgba(79,169,206,.35); }
  .act.danger:hover{ color:var(--danger); border-color:rgba(210,96,76,.35); }
  .act.ban:hover{ color:var(--danger); border-color:rgba(210,96,76,.35); }
  .act .ic{ width:13px; height:13px; }
  /* `row-acts` sits on the <td> itself. `display:flex` there stops the cell being a table
     cell at all — it pops out of the row and takes its bottom border with it, which is the
     "columns slid off" the owner reported. Keep it a cell; the buttons are inline. */
  .row-acts{ white-space:nowrap; text-align:right; }
  .row-acts .unwatch + .unwatch{ margin-left:6px; }
  .unwatch.ban:hover{ color:var(--danger); border-color:rgba(210,96,76,.35); }

  /* An empty state used to be `icon + " " + sentence` inside one centred line, so the
     SVG landed mid-sentence on the text baseline and a <br> glued two paragraphs
     together. Icon above, headline, then the explanation, with room between them. */
  .empty{ display:flex; flex-direction:column; align-items:center; text-align:center;
    gap:10px; color:var(--dim); padding:52px 28px; font-size:13.5px; line-height:1.65;
    border:1px dashed var(--border); border-radius:var(--r-lg); }
  .empty .ic{ width:26px; height:26px; color:var(--faint); }
  .empty .empty-title{ font-size:15px; font-weight:600; color:var(--muted); }
  .empty .empty-body{ max-width:46ch; }
  .warn-banner{ display:flex; gap:10px; align-items:flex-start; background:rgba(210,96,76,.07);
    border:1px solid rgba(210,96,76,.3); border-radius:var(--r-md); padding:12px 14px; margin:4px 2px 14px; }
  .warn-banner .ic{ color:var(--danger); flex-shrink:0; margin-top:1px; }
  .warn-list{ font-size:13px; color:var(--muted); line-height:1.65; }
  .source-section.trend .ic{ color:var(--flame); }
  /* flex-start, not center: the card carries its action row now, and centring pushed
     the flame and the velocity into the middle of a two-line body instead of lining
     them up with the repo name. */
  .trend-card{ display:flex; gap:14px; align-items:flex-start; background:var(--surface);
    border:1px solid var(--border); border-radius:var(--r-lg); padding:15px 18px; margin-bottom:10px; }
  .trend-card .card-actions{ margin-top:11px; }
  .trend-ic{ display:grid; place-items:center; width:32px; height:32px; border-radius:var(--r-md);
    background:var(--inset); border:1px solid var(--border); flex-shrink:0; }
  .trend-ic .ic{ color:var(--dim); width:16px; height:16px; }
  .trend-body{ flex:1; min-width:0; }
  .trend-repo{ font-weight:600; font-size:15px; color:var(--text); text-decoration:none;
    letter-spacing:-.015em; }
  .trend-repo:hover{ color:var(--gh-fg); }
  .trend-desc{ font-size:13px; color:var(--muted); margin-top:3px; line-height:1.65; }
  .trend-metric{ text-align:right; flex-shrink:0; }
  .trend-vel{ display:block; color:var(--text); font-weight:700; font-size:17px;
    font-variant-numeric:tabular-nums; }
  .trend-stars{ display:block; color:var(--dim); font-size:12px; margin-top:2px;
    font-variant-numeric:tabular-nums; }

  /* profiles */
  .profiles-layout{ display:flex; gap:14px; align-items:flex-start; }
  .profile-list{ width:238px; flex-shrink:0; background:var(--surface);
    border:1px solid var(--border); border-radius:var(--r-lg); padding:15px; }
  .plist-item{ display:flex; align-items:center; gap:8px; width:100%; text-align:left;
    padding:9px 11px; border-radius:var(--r-md); font-weight:500; font-size:13.5px;
    color:var(--muted); margin-bottom:3px;
    transition:background-color .15s var(--ease), color .15s var(--ease); }
  .plist-item:hover{ background:rgba(255,255,255,.035); color:var(--text); }
  .plist-item.active{ background:rgba(255,255,255,.06); color:var(--text); font-weight:600; }
  .plist-item .n{ margin-left:auto; font-size:11.5px; color:var(--dim); font-variant-numeric:tabular-nums; }
  input[type=text],input[type=password]{ width:100%; padding:9px 12px; border:1px solid var(--border);
    border-radius:var(--r-md); background:var(--inset); color:var(--text); font:inherit; font-size:13px; }
  input[type=text]:focus,input[type=password]:focus{ outline:none; border-color:var(--border-hi); }
  input[type=text]::placeholder,input[type=password]::placeholder{ color:var(--faint); }
  select{ padding:9px 12px; border:1px solid var(--border); border-radius:var(--r-md);
    background:var(--inset); color:var(--text); font:inherit; font-size:13px; }
  select:focus{ outline:none; border-color:var(--border-hi); }
  .editor{ flex:1; min-width:0; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--r-lg); padding:22px 24px 24px; }
  .editor-head{ display:flex; align-items:center; gap:12px; margin-bottom:22px;
    padding-bottom:16px; border-bottom:1px solid var(--border); }
  .editor-title{ font-size:21px; font-weight:700; letter-spacing:-.03em; color:var(--text); }
  .rename{ font-size:21px; font-weight:700; padding:6px 10px; margin-left:-10px;
    border:1px solid transparent; border-radius:var(--r-md); background:transparent;
    color:var(--text); letter-spacing:-.03em; }
  .rename:hover, .rename:focus{ border-color:var(--border-hi); background:var(--inset); outline:none; }
  .block{ margin-bottom:26px; }
  .block:last-of-type{ margin-bottom:20px; }
  /* the source colour carries over from the feed, so a block is identifiable at a glance */
  .block-title{ display:flex; align-items:center; gap:9px; font-weight:700; font-size:10.5px;
    letter-spacing:.2em; text-transform:uppercase; color:var(--dim); margin-bottom:12px; }
  .block-title .ic{ width:15px; height:15px; }
  /* Colour by CLASS, never by position. As :nth-of-type these counted every sibling
     <div> inside #editor, and .editor-head is the first one — so GitHub picked up the
     Twitter blue and the Twitter block got no colour at all. */
  .block.gh .block-title .ic{ color:var(--gh-fg); }
  .block.tw .block-title .ic{ color:var(--tw-fg); }
  /* Feeds get NO new hue. Colour identifies the source — blue X, violet GitHub, green
     trending — and a fourth invented one is what reads as "random colours". Neutral
     until this source earns a colour of its own. */
  .block.feed .block-title .ic{ color:var(--feed-fg); }
  /* each field is its own panel — as bare stacked rows the labels, help and chips ran
     together and the screen read as one grey slab */
  .field{ background:var(--inset); border:1px solid var(--border); border-radius:var(--r-md);
    padding:14px 15px; margin-bottom:9px; }
  .field:last-child{ margin-bottom:0; }
  .field-label{ font-size:13px; font-weight:650; margin-bottom:3px; color:var(--text); }
  .field-help{ font-size:13px; color:var(--dim); margin-bottom:11px; line-height:1.65; }
  .tags{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .chip{ display:inline-flex; align-items:center; gap:7px; background:var(--surface);
    border:1px solid var(--border-hi); color:var(--text);
    padding:6px 7px 6px 10px; border-radius:var(--r-md); font-size:13px; font-weight:500; }
  .chip-x{ display:flex; padding:2px; border-radius:4px; color:var(--faint); }
  .chip-x:hover{ color:var(--text); background:rgba(255,255,255,.08); }
  .chip-x .ic{ width:12px; height:12px; }
  .chip-ic{ width:13px; height:13px; color:var(--dim); }
  .chip-label{ max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip-id{ color:var(--faint); font-size:11.5px; }
  .chip-edit{ display:flex; padding:2px; border-radius:4px; color:var(--faint); }
  .chip-edit:hover{ color:var(--text); background:rgba(255,255,255,.08); }
  .chip-edit .ic{ width:12px; height:12px; }
  .src-picker{ display:flex; flex-direction:column; gap:8px; margin-bottom:4px; }
  .src-picker.locked{ opacity:.5; pointer-events:none; }
  .src-group{ border:1px solid var(--border); border-radius:var(--r-md);
    background:var(--inset); overflow:hidden; }
  .src-head{ display:flex; align-items:center; gap:9px; padding:11px 13px; font-size:13px;
    font-weight:600; user-select:none; cursor:pointer; }
  .src-head .n{ margin-left:auto; font-size:11.5px; color:var(--dim); font-weight:400;
    font-variant-numeric:tabular-nums; }
  .src-body{ padding:0 13px 11px; display:flex; flex-direction:column; }
  .src-sub{ display:flex; align-items:center; gap:8px; font-size:9.5px; font-weight:700;
    letter-spacing:.16em; text-transform:uppercase; color:var(--faint);
    user-select:none; cursor:pointer; padding:10px 0 8px; }
  .src-sub .cbox{ width:13px; height:13px; }
  .src-sub .kn{ margin-left:auto; font-size:11.5px; letter-spacing:0; text-transform:none;
    font-weight:500; color:var(--dim); font-variant-numeric:tabular-nums; }
  .src-sub:hover{ color:var(--dim); }
  .src-items{ display:flex; gap:6px; flex-wrap:wrap; row-gap:6px; }
  /* One element per source, not three. Each chip used to carry a checkbox square, a
     tick glyph, a kind icon AND a border — 7 nodes each, 14 chips, and the kind icon
     merely repeated the sub-header two lines above. The chip IS the checkbox now:
     lit means included, dimmed and dashed means excluded. */
  .src-item{ display:inline-flex; align-items:center; font-size:13px; user-select:none;
    cursor:pointer; padding:6px 11px; border-radius:var(--r-sm); background:var(--surface);
    border:1px solid var(--border-hi); color:var(--text);
    transition:border-color .15s var(--ease), color .15s var(--ease), opacity .15s var(--ease); }
  .src-item:hover{ border-color:var(--dim); }
  .src-item.off{ background:transparent; border-style:dashed; border-color:var(--border);
    color:var(--faint); }
  .src-item.off:hover{ color:var(--dim); border-color:var(--dim); }
  .src-collapse{ background:none; border:none; color:var(--faint); cursor:pointer; padding:2px;
    margin:-2px -4px -2px 0; display:flex; align-items:center; transition:transform .15s var(--ease); }
  .src-collapse:hover{ color:var(--text); }
  .src-group.collapsed .src-collapse{ transform:rotate(-90deg); }
  .src-group.collapsed .src-body{ display:none; }
  .src-empty{ font-size:13px; color:var(--dim); padding-bottom:10px; }
  /* an X source with no session: visible so you can see it exists, but not runnable */
  .src-item.locked-src{ opacity:.45; pointer-events:none; }
  .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.62); display:flex;
    align-items:center; justify-content:center; z-index:50; }
  .modal-overlay[hidden]{ display:none; }
  .modal{ width:380px; max-width:90vw; background:var(--surface); border:1px solid var(--border-hi);
    border-radius:var(--r-lg); padding:22px; }
  .modal-title{ font-size:16px; font-weight:650; margin-bottom:14px; letter-spacing:-.02em; }
  .modal-label{ font-size:12.5px; color:var(--dim); margin-bottom:5px; } .modal-opt{ color:var(--faint); }
  .modal-id{ font-size:13px; color:var(--dim); background:var(--inset); border:1px solid var(--border);
    border-radius:var(--r-md); padding:9px 11px; margin-bottom:12px; word-break:break-all; }
  .lm-name{ width:100%; margin-bottom:16px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; }
  .chip-input{ min-width:170px; flex:1; border:1px dashed var(--border-hi) !important; }
  .chip-input:focus{ border-style:solid !important; border-color:var(--dim) !important; }
  .editor-foot{ display:flex; align-items:center; gap:14px; margin-top:4px; }
  .btn-save{ display:inline-flex; align-items:center; gap:7px; background:var(--primary);
    color:var(--on-primary); padding:9px 20px; border-radius:var(--r-md); font-weight:600; font-size:13px;
    transition:background-color .15s var(--ease); }
  .btn-save:hover{ background:var(--primary-hover); }
  .btn-save:active{ transform:scale(.97); }
  .save-msg{ font-size:13px; color:var(--dim); } .save-msg.err{ color:var(--danger); }
  .save-msg.ok{ color:var(--primary); }

  /* tracked */
  table{ width:100%; border-collapse:collapse; }
  thead th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.14em;
    color:var(--faint); font-weight:700; padding:0 12px 11px; border-bottom:1px solid var(--border);
    white-space:nowrap; }
  thead th.num{ text-align:right; }
  thead th.sortable{ cursor:pointer; user-select:none; }
  thead th.sortable:hover{ color:var(--muted); }
  .sort-arrow{ width:11px; height:11px; margin-left:4px; vertical-align:-1px;
    transition:transform .15s var(--ease); }
  .sort-arrow.asc{ transform:rotate(180deg); }
  tbody td{ padding:14px 12px; border-bottom:1px solid var(--border); vertical-align:top; font-size:13px; }
  tbody tr:hover td{ background:rgba(255,255,255,.02); }
  tbody td.num{ text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .repo{ display:inline-flex; align-items:center; gap:8px; font-weight:600; cursor:pointer; }
  .repo:hover{ color:var(--gh-fg); }
  .repo .ic{ width:14px; height:14px; color:var(--dim); }
  .repo-desc{ margin-top:5px; font-size:13px; color:var(--muted); line-height:1.65; max-width:52ch; }
  .vel-up{ color:var(--primary); font-weight:600; display:inline-flex; align-items:center; gap:4px;
    justify-content:flex-end; }
  .vel-up .ic{ width:13px; height:13px; }
  .vel-flat{ color:var(--dim); font-weight:600; }
  .vel-measuring{ color:var(--faint); font-size:12.5px; font-style:italic; }
  .unwatch{ display:inline-flex; align-items:center; gap:5px; color:var(--dim); font-size:12px;
    background:var(--inset); border:1px solid var(--border); padding:5px 9px; border-radius:var(--r-sm);
    transition:color .15s var(--ease), border-color .15s var(--ease); }
  .unwatch:hover{ color:var(--text); border-color:var(--border-hi); }
  .unwatch .ic{ width:12px; height:12px; }
  .tracked-note{ margin-top:14px; font-size:13px; color:var(--dim); line-height:1.65; }

  /* toast */
  #toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--text); color:var(--bg); padding:10px 17px; border-radius:var(--r-md); font-size:13px;
    font-weight:600; opacity:0; pointer-events:none;
    transition:opacity .2s var(--ease), transform .2s var(--ease); z-index:100; }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* prompt editor */
  .box-label.shared{ margin-top:20px; }
  .prompt-head{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .prompt-name{ font-size:17px; font-weight:650; letter-spacing:-.02em; }
  .prompt-about{ font-size:13px; color:var(--muted); line-height:1.65; margin-bottom:12px;
    background:var(--inset); border:1px solid var(--border); border-radius:var(--r-md);
    padding:11px 13px; max-width:80ch; }
  /* An icon beside text MUST sit in a flex box. As a plain span the SVG lands on the
     text baseline — here it left the lock 4px from the pill's top and 6.5px from its
     bottom, which is exactly the skew the owner pointed at. */
  .prompt-lock{ display:inline-flex; align-items:center; gap:6px; font-size:12px;
    color:var(--dim); border:1px solid var(--border); border-radius:999px; padding:4px 11px; }
  .prompt-lock .ic{ width:12px; height:12px; }
  /* The file on the page is a PREVIEW, not an input. As a live textarea it was one
     stray keystroke from being replaced, with a Save sitting right under it. */
  /* 13px mono at 1.65 in a full-width box was a wall. Bigger, looser, and padded like
     something meant to be read rather than a code dump. */
  .prompt-preview{ width:100%; max-height:440px; overflow:auto; padding:20px 22px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:14px;
    line-height:1.8; color:var(--muted); background:var(--inset); white-space:pre-wrap;
    border:1px solid var(--border); border-radius:var(--r-md); }
  .pe-overlay{ padding:36px; }
  /* Sized to the TEXT, not the window. The prompt files are hard-wrapped (p90 = 85
     chars, longest 125), so a 1100px box left ~350px of dead space to the right of
     every line and the whole thing read as text shoved into the left edge. */
  .pe-modal{ width:min(880px, 100%); height:100%; display:flex; flex-direction:column;
    background:var(--surface); border:1px solid var(--border-hi); border-radius:var(--r-lg);
    padding:18px 20px 20px; gap:14px; }
  .pe-head{ display:flex; align-items:center; gap:10px; }
  .pe-name{ font-family:ui-monospace,Menlo,monospace; font-size:15px; font-weight:650; }
  /* ONE square icon button, used by every dismiss/row control. There used to be five
     different ones — 34px r10 bordered (guide), 30px r6 bordered (editor), 28px r6
     borderless (profile row), 16px r4 (chip) — which is what read as "the crosses are
     crooked": not one of them was off-centre, they were all different sizes. */
  .icon-btn{ width:30px; height:30px; flex:none; border-radius:var(--r-sm); display:grid; place-items:center;
    color:var(--dim); border:1px solid var(--border); background:var(--inset);
    transition:color .15s var(--ease), border-color .15s var(--ease); }
  .icon-btn:hover{ color:var(--text); border-color:var(--border-hi); }
  .icon-btn:active{ transform:scale(.94); }
  .icon-btn .ic{ width:15px; height:15px; }
  .pe-area{ flex:1; width:100%; resize:none; padding:20px 22px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:14px;
    line-height:1.8; color:var(--text); background:var(--inset);
    border:1px solid var(--border); border-radius:var(--r-md); }
  .pe-area:focus{ outline:none; border-color:var(--border-hi); }
  .pe-foot{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
  /* the way out of a bad edit; hidden until a save has actually replaced something */
  #pe-restore[hidden]{ display:none; }
  .guide{ margin-top:16px; border:1px solid var(--border); border-radius:var(--r-md);
    background:var(--inset); overflow:hidden; }
  .guide-head{ display:flex; align-items:center; gap:9px; width:100%; text-align:left;
    padding:12px 14px; font-size:13px; font-weight:600; color:var(--muted); }
  .guide-head:hover{ color:var(--text); }
  .guide-head .ic{ width:15px; height:15px; }
  .guide-chev{ transition:transform .15s var(--ease); }
  .guide.open .guide-chev{ transform:rotate(180deg); }
  .guide-body{ display:none; padding:0 14px 14px; }
  .guide.open .guide-body{ display:block; }
  .guide-steps{ margin:0 0 14px; padding-left:20px; color:var(--muted); font-size:13px;
    line-height:1.7; }
  .guide-steps li{ margin-bottom:7px; }
  .prompt-note{ font-size:13px; color:var(--dim); line-height:1.65; margin-top:11px; }
  .test-box{ margin-top:18px; border:1px solid var(--border); border-radius:var(--r-lg);
    background:var(--inset); padding:15px 17px; }
  .test-summary{ font-weight:650; margin-bottom:4px; }
  .test-meta{ font-size:12.5px; color:var(--dim); line-height:1.65; }
  .test-rows{ margin-top:12px; max-height:340px; overflow:auto; }
  .test-row{ display:grid; grid-template-columns:1fr 54px 54px; gap:10px; align-items:baseline;
    padding:8px 0; border-top:1px solid var(--border); font-size:13px; }
  .test-row .t{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); }
  .test-row .n{ font-family:ui-monospace,Menlo,monospace; text-align:right; font-size:13px;
    font-variant-numeric:tabular-nums; }
  .test-row .n.up{ color:var(--primary); font-weight:700; }
  .test-row .n.none{ color:var(--faint); }
  .test-head{ display:grid; grid-template-columns:1fr 54px 54px; gap:10px;
    font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); font-weight:700; }
  /* profile list controls */
  .plist-actions{ display:flex; gap:8px; margin-top:10px; padding-top:12px;
    border-top:1px solid var(--border); }
  .plist-actions .btn-ghost{ font-size:12.5px; padding:6px 11px; }
  .prow{ display:flex; align-items:center; gap:4px; }
  .prow .plist-item{ flex:1; }
  .prow-btn.danger:hover{ color:var(--danger); border-color:rgba(210,96,76,.4); }
  .plist-actions .btn-ghost.on{ color:var(--text); border-color:var(--border-hi);
    background:rgba(255,255,255,.06); }
  .plist-actions{ flex-wrap:wrap; }

  /* settings + wizard */
  /* Settings ran as a 760px column, so on a wide window the boxes sat pinned to the
     left with dead space beside them while every other view ran full width. Boxes are
     full width now, stacked, exactly like .profile-box on the feed. A two-column grid
     was tried here first and rejected: it does not look like the rest of the app. */
  .set-grid{ display:flex; flex-direction:column; gap:13px; }
  .set-box{ border:1px solid var(--border); border-radius:var(--r-lg); background:var(--surface);
    padding:20px; }
  .set-box h3{ display:flex; align-items:center; gap:10px;
    font-size:16px; font-weight:650; letter-spacing:-.015em; margin:0 0 18px;
    padding-bottom:14px; border-bottom:1px solid var(--border); }
  /* a STATE, not another help line. It was a bold sentence in the same grey stack as
     the explanation and the instructions, so all three read as one block of noise. */
  .pill{ font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:999px;
    color:var(--dim); border:1px solid var(--border); }
  .pill.ok{ color:var(--primary); border-color:rgba(31,169,111,.4); }
  .set-steps{ font-size:13px; color:var(--muted); line-height:1.65; margin-top:16px;
    padding-top:16px; border-top:1px solid var(--border); }
  /* the only irreversible control in the app; marked, not hidden */
  .danger-zone{ border-color:rgba(210,96,76,.28); }
  .danger-zone h3{ color:var(--danger); border-bottom-color:rgba(210,96,76,.28); }
  .wipe-modal{ width:440px; }
  .wipe-row{ display:flex; align-items:flex-start; gap:11px; padding:12px 13px; cursor:pointer;
    border:1px solid var(--border); border-radius:var(--r-md); background:var(--inset);
    margin-bottom:8px; transition:border-color .15s var(--ease); }
  .wipe-row:hover{ border-color:var(--border-hi); }
  .wipe-row.on{ border-color:rgba(210,96,76,.4); }
  .wipe-row .cbox{ margin-top:2px; }
  .wipe-row.on .cbox{ background:var(--danger); border-color:var(--danger); color:#fff; }
  .wipe-text{ display:flex; flex-direction:column; gap:3px; }
  .wipe-name{ font-size:13.5px; font-weight:600; }
  .wipe-n{ color:var(--dim); font-weight:500; }
  .wipe-help{ font-size:12.5px; color:var(--dim); line-height:1.65; }
  .wipe-modal .modal-actions{ margin-top:16px; }
  /* Spacing was upside down: 3px between a label and its own help line, 20px between
     one field and the next. So a help line sat closer to the NEXT field's label than
     to the thing it explained, and the whole screen read as one squeezed slab. The
     rule now is the ordinary one — gaps INSIDE a group are smaller than gaps BETWEEN
     groups, and there is a rule line between fields to make the split visible. */
  .set-field{ margin-bottom:26px; padding-bottom:26px; border-bottom:1px solid var(--border); }
  .set-field:last-child{ margin-bottom:0; padding-bottom:0; border-bottom:none; }
  .set-label{ font-weight:600; font-size:13.5px; margin-bottom:6px; }
  .set-help{ font-size:13px; color:var(--dim); line-height:1.65; }
  .set-row{ display:flex; gap:8px; align-items:center; margin-top:14px; }
  /* the masked value used to float loose beside the button with nothing saying what
     it was; it is a labelled pair now */
  .set-current{ display:flex; flex-direction:column; gap:2px; }
  .set-current .cap{ font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--faint); font-weight:700; }
  .set-row input[type=text],.set-row input[type=password]{ flex:1; min-width:0; max-width:420px;
    font-family:ui-monospace,Menlo,monospace; font-size:13px; }
  .set-state{ font-size:12.5px; color:var(--dim); min-width:120px;
    font-family:ui-monospace,Menlo,monospace; }
  .set-state.ok{ color:var(--primary); font-weight:600; }
  .set-state.bad{ color:var(--danger); font-weight:600; }
  .set-actions{ display:flex; gap:10px; align-items:center; margin-top:16px;
    padding-top:16px; border-top:1px solid var(--border); }
  /* a field already ends on a rule — without this the two draw a double line */
  .set-field + .set-actions{ border-top:none; padding-top:0; }
  /* Tuning: two columns of short numeric fields, each an inset panel so the help line
     belongs to its own label rather than sitting closer to the next one — the spacing
     mistake the flat Settings stack made before. The text knob spans both. */
  .tune-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
  .tune-row{ background:var(--inset); border:1px solid var(--border);
    border-radius:var(--r-md); padding:13px 14px; display:flex; flex-direction:column; }
  .tune-row.wide{ grid-column:1 / -1; }
  .tune-row .set-help{ flex:1; margin-bottom:11px; font-size:12.5px; }
  .tune-row input{ width:100%; max-width:170px; padding:8px 10px;
    font-family:ui-monospace,Menlo,monospace; font-size:13px; color:var(--text);
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r-sm); }
  .tune-row.wide input{ max-width:none; }
  .tune-row input:focus{ outline:none; border-color:var(--border-hi); }
  @media (max-width:1180px){ .tune-grid{ grid-template-columns:1fr; } }
  .cookie-area{ width:100%; min-height:110px; resize:vertical; padding:12px;
    font-family:ui-monospace,Menlo,monospace; font-size:12.5px; color:var(--muted);
    background:var(--inset); border:1px solid var(--border); border-radius:var(--r-md); margin-top:12px; }
  .cookie-area:focus{ outline:none; border-color:var(--border-hi); }
  .cookie-area::placeholder{ color:var(--faint); }
  /* The guide is a full SCREEN, not a modal. As a 620px box on the first launch it read
     as a dialog to dismiss, and it can now be closed outright. */
  /* Centred, not pinned to the top. A step is ~265px tall in an 860px window, so
     align-items:flex-start left 600px of black under it and the content read as a
     strip crammed into the corner. `auto` margins keep it centred while still
     scrolling when a step is taller than the window, which `center` alone does not. */
  .wiz-screen{ position:fixed; inset:0; z-index:60; background:var(--bg); overflow-y:auto;
    display:flex; justify-content:center; padding:48px 28px; }
  .wiz-screen[hidden]{ display:none; }
  .wiz-inner{ width:100%; max-width:620px; margin:auto 0; }
  .wiz-close{ position:fixed; top:20px; right:22px; }
  .wiz-title{ font-size:26px; font-weight:700; letter-spacing:-.032em; margin-bottom:16px; }
  .wiz-actions{ display:flex; align-items:center; gap:9px; margin-top:26px;
    padding-top:20px; border-top:1px solid var(--border); }
  .wiz-need{ font-size:12.5px; color:var(--dim); margin-top:9px; }
  .wiz-warn{ display:flex; align-items:flex-start; gap:9px; margin-top:16px; padding:12px 14px;
    border:1px solid rgba(210,96,76,.3); border-radius:var(--r-md);
    background:rgba(210,96,76,.07); font-size:13px; color:var(--muted); line-height:1.65; }
  .wiz-warn .ic{ width:15px; height:15px; color:var(--danger); margin-top:1px; }
  /* NOT uppercase. Ukrainian "Крок 2 з 5" uppercases to "КРОК 2 З 5", and a Cyrillic З at 9.5px
     with .18em tracking is indistinguishable from the digit 3 — the owner read it as
     the digit 3. Any caps label carrying a Cyrillic preposition has this problem. */
  .wiz-step{ font-size:12px; letter-spacing:.04em; color:var(--dim);
    font-weight:600; margin-bottom:10px; }
  .wiz-text{ font-size:14.5px; line-height:1.75; color:var(--muted); margin-bottom:20px; }
  .guide-acts{ display:flex; gap:9px; flex-wrap:wrap; }
  /* Reduced motion means fewer and gentler animations, NOT zero — killing every
     transition took the colour and opacity feedback with it. */
  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:.01ms !important; }
    .nav-item:active,.btn-primary:active,.btn-ghost:active,.btn-save:active,
    .act:active{ transform:none; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="mk" id="brand-icon"></span>Info Parser</div>
    <button class="nav-item active" data-view="feed" id="nav-feed"></button>
    <button class="nav-item" data-view="profiles" id="nav-profiles"></button>
    <button class="nav-item" data-view="prompts" id="nav-prompts"></button>
    <button class="nav-item" data-view="tracked" id="nav-tracked"></button>
    <button class="nav-item" data-view="settings" id="nav-settings"></button>
  </aside>

  <main class="content">
    <!-- FEED -->
    <section id="view-feed" class="view">
      <h1 class="view-title" data-i18n="feed.title"></h1>
      <p class="view-sub" data-i18n="feed.sub"></p>
      <div class="profile-box">
        <div class="box-label" data-i18n="feed.box_label"></div>
        <div id="profile-checks" class="src-picker"></div>
        <div class="profile-row">
          <span class="spacer"></span>
          <button class="btn-primary" id="run-btn"></button>
          <button class="btn-ghost danger" id="stop-btn" hidden></button>
          <button class="btn-ghost" id="md-btn"></button>
          <span class="status" id="status"></span>
        </div>
      </div>
      <div id="results"></div>
    </section>

    <!-- PROFILES -->
    <section id="view-profiles" class="view" hidden>
      <h1 class="view-title" data-i18n="profiles.title"></h1>
      <p class="view-sub" data-i18n="profiles.sub"></p>
      <div class="profiles-layout">
        <div class="profile-list">
          <div class="box-label" data-i18n="profiles.box_label"></div>
          <div id="plist"></div>
        </div>
        <div class="editor" id="editor"></div>
      </div>
    </section>

    <!-- PROMPTS -->
    <section id="view-prompts" class="view" hidden>
      <h1 class="view-title" data-i18n="prompts.title"></h1>
      <p class="view-sub" data-i18n="prompts.sub"></p>
      <div class="profiles-layout">
        <!-- TWO groups: your profiles, and the shared machinery. `_meta` is in
             neither — it had a heading of its own for a day, and a whole section for
             a file you already reach from the guide was pointless. It is copy-only,
             handed over by the guide's button. -->
        <div class="profile-list">
          <div class="box-label" data-i18n="prompts.box_profiles"></div>
          <div id="prompt-list-own"></div>
          <div class="box-label shared" data-i18n="prompts.box_shared"></div>
          <div id="prompt-list-shared"></div>
        </div>
        <div class="editor" id="prompt-editor"></div>
      </div>

function svg(name, cls){ return `<svg class="ic ${cls||''}" viewBox="0 0 24 24">${ICONS[name]||''}</svg>`; }

// A link reaching a card came off a scraped page. esc() makes it safe as TEXT but
// leaves the scheme alone, so `javascript:` survives into href and one click runs
// script with the whole window.pywebview.api in reach. http/https only.
let STRINGS = {}, LANG = 'en';
// Strings come from Python's OWN catalogue (Api.get_strings) rather than a copy kept
// here — one source, so a translated build cannot half-translate.
function tr(key, vars){
  const v = STRINGS[key];
  if(typeof v !== 'string') return key;
  if(!vars) return v;
  let out = v;
  for(const k in vars) out = out.split('{'+k+'}').join(vars[k]);
  return out;
}
// Static markup carries data-i18n / data-i18n-ph and is filled once the catalogue has
// arrived. init() awaits it before anything renders, so there is no flash of keys.
function applyStaticStrings(){
  document.documentElement.setAttribute('lang', LANG);
  document.querySelectorAll('[data-i18n]').forEach(el =>
    el.textContent = tr(el.getAttribute('data-i18n')));
  document.querySelectorAll('[data-i18n-ph]').forEach(el =>
    el.setAttribute('placeholder', tr(el.getAttribute('data-i18n-ph'))));
}
function emptyState(icon, titleKey, bodyKey){

    <div class="empty-title">${esc(tr(titleKey))}</div>
    <div class="empty-body">${esc(tr(bodyKey))}</div></div>`;
}
function safeUrl(u){ const v = String(u == null ? '' : u).trim();
  return /^https?:\/\//i.test(v) ? v : '#'; }

/* ---- toast ---- */
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'), 2200); }

/* ---- nav ---- */
/* scroll offset per view, so switching away and back lands where you left off.
   .content is the scroll container (the page body never scrolls — .app is
   height:100vh/overflow:hidden). Restore happens after the view's render call,
   on the next frame, because renderers replace the innerHTML: setting scrollTop
   before the new content exists would just clamp to 0. */
const VIEW_SCROLL = {};
let CURRENT_VIEW = 'feed';
// Leaving a view re-reads it from disk, so anything typed and not saved is gone
// without a word. One registry rather than an `if` per screen: Profiles had the check
// and Settings did not, so a typed API key and a changed tuning knob both vanished on
// a nav click. A screen added later has to opt in HERE, which is easier to notice than
// a missing branch inside showView.
const VIEW_DIRTY = {
  profiles: { dirty: () => profilesDirty(),  ask: 'profiles.confirm_discard' },
  settings: { dirty: () => settingsDirty(),  ask: 'settings.confirm_discard' },
};
function showView(name){
  const guard = VIEW_DIRTY[CURRENT_VIEW];
  if(guard && name !== CURRENT_VIEW && guard.dirty() && !confirm(tr(guard.ask))) return;
  const box = $('.content');
  if(box) VIEW_SCROLL[CURRENT_VIEW] = box.scrollTop;
  CURRENT_VIEW = name;
  document.querySelectorAll('.view').forEach(v => v.hidden = (v.id !== 'view-'+name));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view===name));
  if(name==='feed') renderSourcePicker();
  if(name==='profiles') renderProfiles();
  if(name==='prompts') renderPrompts();
  if(name==='tracked') renderTracked();
  if(name==='settings') renderSettings();
  const y = VIEW_SCROLL[name] || 0;
  requestAnimationFrame(()=>{ const b = $('.content'); if(b) b.scrollTop = y; });
}

/* ---- feed ---- */
const SRC_KINDS = [
  { kind:'accounts', key:'kind.accounts', icon:'atSign' },
  { kind:'lists',    key:'kind.lists',    icon:'list'   },
  { kind:'searches', key:'kind.searches', icon:'search' },
  { kind:'topics',   key:'kind.topics',   icon:'github' },
  { kind:'feeds',    key:'kind.feeds',    icon:'newspaper' },
  // Podcasts and shows live in their OWN list because `_feedgate.txt` must not judge
  // them (see ranker.gate_feeds). They are still ordinary picker rows: hiding them
  // would mean the run silently collected a source the screen never showed.
  { kind:'interviews', key:'kind.interviews', icon:'mic' },
];
// sticky picker: keys the user turned OFF survive view switches (default = all on)
let GH_TOPICS = new Set();     // the owner's own GitHub topics, filled by renderSourcePicker
const PICKER_OFF = new Set(JSON.parse(localStorage.getItem('pickerOff') || '[]'));
// how many sources each profile actually HAS (not how many are ticked) — a profile
// with none of them cannot produce anything, and the run says so instead of silently
// skipping it. Filled by renderSourcePicker.
let PICKER_TOTALS = {};
// Groups start COLLAPSED — the feed opens on a short list of profiles with their counts,
// not on a wall of every account and tag. `null` (never touched) means "collapse them all",
// which is why this cannot just default to an empty set.
const PICKER_COLLAPSED = new Set(JSON.parse(localStorage.getItem('pickerCollapsed') || 'null') || []);
const PICKER_COLLAPSE_SEEN = localStorage.getItem('pickerCollapsed') !== null;
const FEED_COLLAPSED = new Set(JSON.parse(localStorage.getItem('feedCollapsed') || '[]'));
function saveFeedCollapsed(){ localStorage.setItem('feedCollapsed', JSON.stringify([...FEED_COLLAPSED])); }
// The picker remembers what is turned OFF by a key that STARTS with the profile name,
// so a rename orphaned every one of them: the old rows sat in localStorage forever and
// the renamed profile came back with every source ticked again.
function remapPickerKeys(oldName, newName){
  for(const set of [PICKER_OFF, PICKER_COLLAPSED]){
    for(const key of [...set]){
      const parts = key.split('\u0000');
      if(parts[0] !== oldName) continue;
      set.delete(key);
      parts[0] = newName;
      set.add(parts.join('\u0000'));
    }
  }
  savePickerState();
}
function savePickerState(){
  localStorage.setItem('pickerOff', JSON.stringify([...PICKER_OFF]));
  localStorage.setItem('pickerCollapsed', JSON.stringify([...PICKER_COLLAPSED]));
}
// \u0000 as an escape, not a literal NUL byte: the raw byte made the file read as
// binary, so grep and every text tool skipped it silently.
const pickKey = (profile, kind, value) => `${profile}\u0000${kind}\u0000${value}`;
// A feed URL is stored raw (it is what gets fetched) but SHOWN short: eleven full
// addresses down the picker are a wall nobody reads, and the part that identifies the
// source is the host. The scheme, `www.` and the feed file itself (`/rss.xml`,
// `/feed/`) carry nothing. A YouTube channel keeps its id, because in that URL the id
// is the channel's only name.
function feedLabel(url){
  let s = String(url || '');
  const yt = s.match(/youtube\.com\/feeds\/videos\.xml\?channel_id=([\w-]+)/i);
  if(yt) return 'youtube.com/' + yt[1];
  s = s.replace(/^https?:\/\//i, '').replace(/^www\./i, '').split('?')[0];
  s = s.replace(/\/(rss|feed|atom)(\.xml)?\/?$/i, '').replace(/\/(feed|rss)\.xml$/i, '');
  return s.replace(/\/+$/, '') || String(url || '');
}
async function renderSourcePicker(){
  const data = await api().get_profiles();
  const profiles = (data && data.profiles) || data || {};
  const box = $('#profile-checks');
  const names = Object.keys(profiles);
  // X needs a logged-in session. Hiding those sources when it is missing was WRONG: a
  // profile whose only source is an X account then read as "no sources" and could
  // never be run, with the message blaming the profile the owner had just filled in.
  // They stay visible and counted, greyed and unticked, with the reason spelled out.
  let hasCookies = true;
  try{ const st = await api().setup_state(); hasCookies = !((st && st.missing) || []).includes('cookies'); }
  catch(_){ /* on any doubt treat the session as present rather than grey out a working source */ }
  const kinds = SRC_KINDS;
  PICKER_TOTALS = {};
  // remember every GitHub topic the owner searches, so a card can highlight the tags
  // that are actually his (the rest are the repo's own noise: python, rust, docker)
  GH_TOPICS = new Set(names.flatMap(n => ((profiles[n]||{}).github||{}).topics || [])
                           .map(t => String(t).toLowerCase()));
  if(!names.length){ box.innerHTML = '<span class="status">'+esc(tr('picker.no_profiles'))+'</span>'; return; }
  box.innerHTML = names.map(name=>{
    const cfg = profiles[name] || {};
    const x = cfg.x || {}, gh = cfg.github || {};
    let total = 0, on = 0;
    const subs = kinds.map(k=>{
      const arr = k.kind==='topics' ? (gh.topics||[])
                : k.kind==='feeds' ? ((cfg.feeds||{}).urls||[])
                : k.kind==='interviews' ? ((cfg.feeds||{}).interviews||[])
                : (x[k.kind]||[]);
      if(!arr.length) return '';
      // an X source with no session cannot be scraped, but it still EXISTS and still
      // counts — it is shown, locked, and told why
      const locked = !hasCookies && k.kind !== 'topics' && k.kind !== 'feeds'
                     && k.kind !== 'interviews';
      total += arr.length;
      let kOn = 0;
      const items = arr.map(v=>{
        const id = entryKey(v);
        const itemLabel = (k.kind==='lists' && v && typeof v==='object' && v.name) ? v.name
                        : (k.kind==='feeds' || k.kind==='interviews') ? feedLabel(id) : id;
        const checked = !locked && !PICKER_OFF.has(pickKey(name, k.kind, id));
        if(checked){ on++; kOn++; }
        return `<label class="src-item ${checked?'':'off'} ${locked?'locked-src':''}">
          <input type="checkbox" hidden ${checked?'checked':''} ${locked?'disabled':''} data-profile="${esc(name)}" data-kind="${k.kind}" data-value="${esc(id)}">
          ${esc(itemLabel)}</label>`;
      }).join('');
      return `<div class="src-sub" data-subkind="${k.kind}"><span class="cbox ${!locked&&kOn===arr.length?'on':''}">${svg('check')}</span>${esc(tr(k.key))}

    }).join('');
    PICKER_TOTALS[name] = total;
    const body = total ? subs : '<div class="src-empty">'+esc(tr('picker.no_sources'))+'</div>';
    const isCollapsed = PICKER_COLLAPSE_SEEN ? PICKER_COLLAPSED.has(name) : true;

function onPickerClick(e){

    savePickerState();

  }
  const item = e.target.closest('.src-item');
  if(item){

    recordPick(inp);

    updateSubHead(group, inp.dataset.kind);

  }
  const sub = e.target.closest('.src-sub');       // toggle-all for one kind (accounts/lists/…)
  if(sub){

    const kind = sub.dataset.subkind;
    const boxes = [...group.querySelectorAll(`.src-item input[data-kind="${kind}"]`)];
    if(!boxes.length) return;

    boxes.forEach(b=>{ b.checked=next; b.closest('.src-item').classList.toggle('off', !next); recordPick(b); });
    updateSubHead(group, kind);
    updateGroupHead(group);

  }
  const head = e.target.closest('.src-head');
  if(head){
    const group = head.closest('.src-group');
    const boxes = [...group.querySelectorAll('.src-item input')];
    if(!boxes.length) return;
    const next = !boxes.every(b=>b.checked);       // all on -> off, otherwise all on
    boxes.forEach(b=>{ b.checked=next; b.closest('.src-item').classList.toggle('off', !next); recordPick(b); });

// A topic CARRIES its source (the ranker reads it off the signal that produced it,
// the DB stores it). The link sniffing is only the fallback for topics written before
// that column existed: it cannot tell a lab's blog from any other address, which is
// why every official-source topic used to land in the catch-all section.
function sourceOf(topic){
  const known = (topic.source || '').toLowerCase();
  if(SRC_ORDER.includes(known)) return known;
  const l = (topic.links && topic.links[0] || '').toLowerCase();
  if(l.includes('github.com')) return 'gh';
  if(l.includes('x.com') || l.includes('twitter.com')) return 'tw';
  return 'other';
}
const SRC = { tw:{icon:'twitter', label:'Twitter'}, gh:{icon:'github', label:'GitHub'},
              feed:{icon:'newspaper', key:'kind.feeds'}, pod:{icon:'mic', key:'kind.interviews'},
              other:{icon:'external', key:'source.other'} };
// Feed order, and the same order the .md uses (`export._SOURCE_KEYS`). A podcast is a
// feed post whose publisher did not make the thing it is about, so it sits after the
// first-party sources and before the catch-all.
const SRC_ORDER = ['tw', 'gh', 'feed', 'pod', 'other'];
// Twitter and GitHub are product names and stay literal; the other two are translated,
// so they carry a catalogue key. Reading `.label` blindly printed "undefined" on every
// catch-all card.
function srcLabel(key){ const s = SRC[key] || {}; return s.label || (s.key ? tr(s.key) : key); }

// coarse run phase PULLED from Python (Api.get_phase, polled below), e.g.
// "Collecting Twitter...", "Scoring...". Only meaningful while a run is in flight.
window.setPhase = (text) => { const s = $('#status'); if(s && text) s.textContent = text; };
// One run = one .md, and the feed is the CURRENT session's run and nothing else.
// The screen starts empty on every launch (owner's call, 2026-09-04): he runs, reads,
// exports the .md, and that file is the artifact — a previous run still sitting there
// when he opens the app reads as clutter, not as a saved result. So there is no
// restore, no `feedCleared` flag and no «clear» button; the DATABASE still keeps every
// row, because cross-run dedup is what stops the same topic arriving twice. Deleting
// rows is the Settings wipe, which says so and counts what it removes.
let MD_READY = false;
function setRunning(running){
  $('#run-btn').disabled = running;
  $('#md-btn').disabled = running || !MD_READY;
  const stop = $('#stop-btn');
  stop.hidden = !running;
  if(running) stop.disabled = false;   // a fresh run -> Stop is clickable again
  $('#profile-checks').classList.toggle('locked', running);
}
async function runParser(){
  // a profile with no sources at all can only produce an empty run — refuse and name it
  const empty = Object.keys(PICKER_TOTALS).filter(n => !PICKER_TOTALS[n]);
  if(empty.length && empty.length === Object.keys(PICKER_TOTALS).length){
    $('#status').textContent = tr('status.profile_no_sources', {name: empty.join(', ')});
    return;
  }
  const boxes = [...$('#profile-checks').querySelectorAll('.src-item input:checked')];
  if(!boxes.length){
    // nothing ticked because every source needs an X session is a different problem
    // from nothing ticked because you unticked it
    const locked = $('#profile-checks').querySelectorAll('.src-item.locked-src').length;
    const free = $('#profile-checks').querySelectorAll('.src-item:not(.locked-src)').length;
    $('#status').textContent = (locked && !free) ? tr('status.needs_x_session') : tr('status.pick_source');
    return;
  }
  // Keys can be skipped in the guide now, so say what is missing instead of letting the
  // run spend a scrape and then die on the first scoring call.
  try{
    const st = await api().setup_state();
    const need = ((st && st.missing) || []).filter(m => m !== 'cookies');
    if(need.length){ $('#status').textContent = tr('status.keys_missing'); return; }
  }catch(_){ /* if the check itself fails, let the run try */ }
  // PRESENT is not USABLE. Placeholder text once sat in `.env` for a day: every check
  // above passed, the guide stayed shut, and the run would have scraped for 15 minutes
  // before dying on the first scoring call. Two cheap probes, ~1s, once per run.
  try{
    $('#status').textContent = tr('status.checking_keys');
    const chk = await api().check_keys();
    const dead = (chk && chk.rejected) || [];
    if(dead.length){
      const names = dead.map(k => tr(k === 'GITHUB_TOKEN' ? 'settings.github' : 'settings.openai'));
      $('#status').textContent = tr('status.keys_rejected', {keys: names.join(', ')});
      return;
    }
  }catch(_){ /* the probe itself failing must not block a run the user asked for */ }
  if(empty.length) toast(tr('status.profile_no_sources', {name: empty.join(', ')}));
  const selection = {};
  boxes.forEach(b=>{
    const { profile, kind, value } = b.dataset;
    if(!selection[profile]) selection[profile] = { github:{topics:[]},
                                                   feeds:{urls:[], interviews:[]},
                                                   x:{accounts:[],lists:[],searches:[]} };
    if(kind==='topics') selection[profile].github.topics.push(value);
    else if(kind==='feeds') selection[profile].feeds.urls.push(value);
    else if(kind==='interviews') selection[profile].feeds.interviews.push(value);
    else selection[profile].x[kind].push(value);
  });
  setRunning(true);
  $('#status').textContent=tr('run.working'); $('#results').innerHTML='';
  let res;
  // pull the current coarse phase from Python while the run is in flight
  // (JS -> Python is pywebview's reliable direction; Python push is not)
  const phaseTimer = setInterval(async ()=>{
    try{ const p = await api().get_phase(); if(p) window.setPhase(p); }catch(e){}
  }, 400);
  try{ res = await api().run_parser(selection); }
  catch(e){ res = {error:String(e)}; }
  finally{ clearInterval(phaseTimer); }
  setRunning(false);
  if(res && res.error){ $('#status').textContent=tr('status.error',{error:res.error}); return; }
  // A stopped run still hands back the profiles that finished — their topics are in
  // the DB already, so showing an empty feed would hide work the user paid for and
  // cross-run dedup would bury it next time.
  renderResults((res&&res.topics)||[], (res&&res.alerts)||[], (res&&res.warnings)||[]);
  $('#status').textContent = tr(res && res.cancelled ? 'status.stopped' : 'status.done');
}
async function stopRun(){
  if(!confirm(tr('confirm.stop_run'))) return;
  $('#stop-btn').disabled = true;   // one press per run — the run is winding down
  $('#status').textContent=tr('status.stopping');
  await api().stop();
}
function renderResults(topics, alerts, warnings){
  MD_READY = !!(topics && topics.length);
  $('#md-btn').disabled = !MD_READY;
  let html='';
  // collector failures — surfaced, not silent
  if(warnings && warnings.length){
    html += `<div class="warn-banner">${svg('alert')}<div class="warn-list">${
      warnings.map(w=>`<div>${esc(w)}</div>`).join('')}</div></div>`;
  }
  // trending breakouts — separate channel, above the topics
  if(alerts && alerts.length){
    html += `<div class="source-section trend">${svg('flame')}<span class="h">${esc(tr('feed.trending_heading'))}</span>
      <span class="cnt">${alerts.length}</span><span class="line"></span></div>`;
    html += alerts.map(alertCard).join('');
  }
  // topic cards grouped by source
  // DERIVED from SRC_ORDER, never hand-written: the podcast split added 'pod' to
  // SRC_ORDER and to sourceOf and left this literal at four keys, so groups['pod'] was
  // undefined. The throw is not in the cards but in the LOOP below: it reaches 'pod',
  // groups['pod'] is undefined and list.length raises, so EVERY run rendered nothing
  // at all after a paid sixteen-minute scrape. sourceOf only ever answers a SRC_ORDER
  // member, so deriving the keys from it cannot miss one.
  const groups = Object.fromEntries(SRC_ORDER.map(k => [k, []]));
  topics.forEach(t => groups[sourceOf(t)].push(t));
  for(const key of SRC_ORDER){
    const list = groups[key]; if(!list.length) continue;
    const s = SRC[key];
    const collapsed = FEED_COLLAPSED.has(key);
    html += `<div class="feed-section ${collapsed?'collapsed':''}" data-src="${key}">
      <div class="source-section ${key}" data-sec-toggle role="button" title="${esc(tr('picker.toggle_section'))}">${svg(s.icon)}<span class="h">${esc(srcLabel(key))}</span>
        <span class="cnt">${list.length} ${plural(list.length)}</span><span class="line"></span>
        <button class="sec-collapse" type="button" tabindex="-1">${svg('chevron')}</button></div>
      <div class="section-body">${list.map(t => cardHtml(t, key)).join('')}</div></div>`;
  }
  if(!topics.length && !(alerts&&alerts.length))
    html += emptyState('lightbulb', 'feed.empty', 'feed.empty_body');
  $('#results').innerHTML = html;
}
function alertCard(a){

function cardMeta(t){
  // GitHub repo facts for the feed card: stars + created + last-modified.
  // Each piece is optional (a tweet-only cluster has none) -> render what exists.
  const bits=[];
  if(t.stars!=null) bits.push(`<span class="cm-stars mono">${svg('star')}${fmtNum(t.stars)}</span>`);
  if(t.created) bits.push(`<span>${esc(tr('card.created',{date:fmtDate(t.created)}))}</span>`);
  if(t.updated) bits.push(`<span>${esc(tr('card.updated',{date:fmtDate(t.updated)}))}</span>`);
  return bits.length ? `<div class="card-meta">${bits.join('<span class="cm-dot">·</span>')}</div>` : '';

const TAGS_ON_CARD = 4;
function cardTags(t){

}

function entryKey(v){ return (v && typeof v==='object') ? v.id : v; }

let listModal = null;   // { mode:'add'|'edit', id, index }
function openListModal(mode, id, name, index){
  if(mode==='edit'){
    const entry = PROFILES[SELECTED].x.lists[index];

  }

function normalize(group, field, raw){
  let v = raw.trim();
  if(group==='x' && field==='accounts'){
    const m = v.match(/(?:x\.com|twitter\.com)\/([^\/?#]+)/i);
    if(m) v = m[1];
    return v.replace(/^@/,'');
  }
  if(group==='x' && field==='lists'){
    let name='';
    const bar = v.indexOf('|');                 // "123… | Weekly reads" -> id + name
    if(bar>=0){ name = v.slice(bar+1).trim(); v = v.slice(0,bar).trim(); }
    const m = v.match(/lists\/(\d+)/);
    if(m) v = m[1];
    return { id: v, name };
  }
  if(group==='github' && field==='topics'){     // GitHub topics: lowercase, hyphenated
    return v.toLowerCase().replace(/\s+/g,'-');
  }
  return v;
}
// Same shapes Python enforces (config._check_sources). Checked here too so a bad value
// is refused as you type rather than at Save — a Cyrillic handle used to be accepted,
// saved, listed in the picker and then actually RUN against a URL that cannot exist.
const SOURCE_SHAPE = {
  'x.accounts': { re:/^[A-Za-z0-9_]{1,15}$/, msg:'field.bad_account' },
  'x.lists':    { re:/^\d+$/,                msg:'field.bad_list'    },
  'github.topics': { re:/^[a-z0-9][a-z0-9-]{0,49}$/, msg:'field.bad_topic' },
  'feeds.urls':    { re:/^https?:\/\/.+/i,           msg:'field.bad_feed'  },
  'feeds.interviews': { re:/^https?:\/\/.+/i,        msg:'field.bad_feed'  },
};
function sourceError(group, field, value){
  const rule = SOURCE_SHAPE[group+'.'+field];
  if(!rule) return String(value||'').trim() ? '' : tr('field.bad_search');
  return rule.re.test(String(value||'')) ? '' : tr(rule.msg);
}
function addEntry(group, field, val){
  const arr = PROFILES[SELECTED][group][field];
  const key = (group==='x' && field==='lists') ? (val && val.id) : val;
  const err = sourceError(group, field, key);
  if(err){ toast(err); return false; }
  if(group==='x' && field==='lists'){
    if(arr.some(e => entryKey(e) === val.id)) return false;
    arr.push(val); return true;
  }
  if(arr.includes(val)) return false;
  arr.push(val); return true;
}
function onEditorKeydown(e){
  const inp = e.target.closest('input[data-add]');
  if(!inp || e.key!=='Enter') return;
  e.preventDefault();
  const g = inp.dataset.group, f = inp.dataset.field;
  const val = normalize(g, f, inp.value);
  if(g==='x' && f==='lists'){                    // don't add yet — name it in the modal first
    if(!val || !val.id) return;
    const err = sourceError(g, f, val.id);
    if(err) return toast(err);                   // reject before the naming dialog opens
    inp.value='';
    openListModal('add', val.id, val.name||'');
    return;
  }
  if(!addEntry(g, f, val)) return;
  renderEditor(); focusAdd(g, f);
}
function focusAdd(group, field){

async function onEditorClick(e){

// pull any text typed into an "add" field but not yet Enter'd into the arrays
function flushPending(){
  document.querySelectorAll('#editor input[data-add]').forEach(inp=>{
    // an EMPTY add box is not a pending entry. Pushing it through the validator made
    // every Save toast "bad handle / bad topic / bad feed URL" beside the green

    if(!inp.value.trim()) return;

// What is on screen versus what is on disk. The key inputs start EMPTY (the saved
// value is only ever shown masked), so any text in one is by definition unsaved.
let SETTINGS_SAVED = '';
function settingsSnapshot(){
  const parts = [];
  document.querySelectorAll('#settings-body input, #settings-body select, #settings-body textarea')
    .forEach(el => parts.push((el.id || el.dataset.tune || '') + '=' + el.value));
  // \u0000 as an ESCAPE, never the byte: the cookie textarea can hold newlines, so the
  // separator has to be something no field value can contain — and a literal NUL makes
  // the whole file read as binary to grep, which has cost this project twice.
  return parts.join('\u0000');
}
function markSettingsSaved(){ SETTINGS_SAVED = settingsSnapshot(); }
function settingsDirty(){
  // nothing rendered yet -> nothing to lose
  return !!$('#settings-body').children.length && settingsSnapshot() !== SETTINGS_SAVED;
}

// A free-text model field was one typo away from a run that fails on every call.
// A value already in .env that is not on the list is kept as an extra option rather

const LLM_MODELS = ['gpt-4.1-mini','gpt-4.1','gpt-4o-mini','gpt-4o','gpt-5-mini','gpt-5'];
function modelOptions(current){
  const list = LLM_MODELS.includes(current) || !current ? LLM_MODELS : [current, ...LLM_MODELS];
  return list.map(m => `<option value="${esc(m)}"${m===current?' selected':''}>${esc(m)}</option>`).join('');
}

// You pick the parts, then confirm once with the real numbers in front of you. A
// window.confirm cannot carry checkboxes, and an all-or-nothing wipe made the common
// case (clear shown topics, keep the watchlist) impossible.
const WIPE_PARTS = [
  { key:'topics',  label:'settings.wipe_topics',  help:'settings.wipe_topics_help',  count:s=>s.topics  },
  { key:'tracked', label:'settings.wipe_tracked', help:'settings.wipe_tracked_help', count:s=>s.tracked },
];
let WIPE_ON = new Set(['topics']);   // the one you usually want; the rest are opt-in

async function openWipeModal(){
  const s = await api().db_stats();
  $('#wipe-title').textContent = tr('settings.reset');
  $('#wipe-sub').textContent = tr('settings.wipe_sub');
  $('#wipe-parts').innerHTML = WIPE_PARTS.map(p => `
    <label class="wipe-row ${WIPE_ON.has(p.key)?'on':''}" data-part="${p.key}">
      <span class="cbox ${WIPE_ON.has(p.key)?'on':''}">${svg('check')}</span>
      <span class="wipe-text">
        <span class="wipe-name">${esc(tr(p.label))} <span class="wipe-n mono">${p.count(s)}</span></span>
        <span class="wipe-help">${esc(tr(p.help))}</span>
      </span>
    </label>`).join('');
  syncWipeButton();
  $('#wipe-modal').hidden = false;
}
function closeWipeModal(){ $('#wipe-modal').hidden = true; }
function syncWipeButton(){
  const btn = $('#wipe-go');
  btn.disabled = WIPE_ON.size === 0;
  btn.innerHTML = svg('trash') + esc(tr('settings.wipe_go'));
}
function onWipeClick(e){
  if(e.target.id === 'wipe-modal') return closeWipeModal();
  if(e.target.closest('#wipe-cancel')) return closeWipeModal();
  if(e.target.closest('#wipe-go')) return runWipe();
  const row = e.target.closest('[data-part]');
  if(!row) return;
  e.preventDefault();
  const k = row.dataset.part;
  WIPE_ON.has(k) ? WIPE_ON.delete(k) : WIPE_ON.add(k);
  row.classList.toggle('on', WIPE_ON.has(k));
  row.querySelector('.cbox').classList.toggle('on', WIPE_ON.has(k));
  syncWipeButton();
}
async function runWipe(){
  const s = await api().db_stats();
  const picked = WIPE_PARTS.filter(p => WIPE_ON.has(p.key))
                           .map(p => `${tr(p.label)} (${p.count(s)})`).join(', ');
  if(!confirm(tr('settings.wipe_confirm', {parts: picked}))) return;
  const parts = {};
  WIPE_PARTS.forEach(p => parts[p.key] = WIPE_ON.has(p.key));
  const res = await api().reset_database(parts);
  if(res && res.errors) return toast(res.errors[0]);
  // Wiping the topics must clear the SCREEN too, not just the .md button: cards left
  // behind would outlive the rows they came from and their keep checkbox would write
  // to nothing.
  if(parts.topics){
    MD_READY = false;
    $('#md-btn').disabled = true;
    $('#results').innerHTML = '';
  }
  closeWipeModal();
  toast(tr('settings.reset_done'));
  showDbStats();
}
